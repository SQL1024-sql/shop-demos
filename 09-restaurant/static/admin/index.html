<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>炊煙 店家後台</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1d1814">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1814'/%3E%3Cpath d='M16 25c-4 0-6-3-5-6 1-2 3-3 3-6 2 1 3 3 3 5 1-1 1-2 1-3 2 2 3 4 3 6 0 2-2 4-5 4z' fill='%23e0612a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="login" id="login" hidden>
  <form id="login-form" class="login-card">
    <h1>炊煙<small>店家後台</small></h1>
    <label>密碼<input type="password" name="password" required autocomplete="current-password"></label>
    <p class="hint" id="demo-hint"></p>
    <p class="error" id="login-error" role="alert"></p>
    <button class="primary big" type="submit">登入</button>
    <a class="back" href="/">回訂位頁</a>
  </form>
</div>

<div id="app" hidden>
  <header class="bar">
    <b class="brand">炊煙<small>後台</small></b>
    <div class="daynav" role="group" aria-label="切換日期">
      <button type="button" class="icon" data-shift="-1" aria-label="前一天"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
      <input type="date" id="day" aria-label="日期">
      <button type="button" class="icon" data-shift="1" aria-label="後一天"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
      <button type="button" class="ghost" id="today-btn">今天</button>
    </div>
    <form id="search" role="search"><input type="search" name="q" placeholder="搜尋姓名、電話、代碼" aria-label="搜尋訂位"></form>
    <div class="bar-end"><a class="ghost" href="/" target="_blank">訂位頁</a><button type="button" class="ghost" id="logout">登出</button></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="功能">
    <button role="tab" data-tab="list" aria-selected="true">訂位</button>
    <button role="tab" data-tab="timeline" aria-selected="false">桌位時間軸</button>
    <button role="tab" data-tab="wait" aria-selected="false">候補<span class="count" id="wait-count"></span></button>
    <button role="tab" data-tab="stats" aria-selected="false">統計</button>
    <button role="tab" data-tab="settings" aria-selected="false">設定</button>
  </nav>

  <main>
    <section data-panel="list" role="tabpanel">
      <div class="kpis" id="kpis"></div>
      <div class="toolbar">
        <h2 id="list-title"></h2>
        <select id="filter" aria-label="篩選狀態">
          <option value="active">未結束</option>
          <option value="all">全部</option>
          <option value="confirmed">已確認</option>
          <option value="seated">已入座</option>
          <option value="completed">已完成</option>
          <option value="no_show">未到</option>
          <option value="cancelled">已取消</option>
        </select>
        <a class="ghost" id="export" download>匯出 CSV</a>
        <button type="button" class="primary" id="new-booking">新增訂位</button>
      </div>
      <div id="list" class="list"></div>
    </section>

    <section data-panel="timeline" role="tabpanel" hidden>
      <div class="toolbar"><h2>桌位時間軸</h2><p class="hint">點色塊可編輯。灰線是現在時間。</p></div>
      <div class="tl-wrap"><div id="timeline" class="timeline"></div></div>
    </section>

    <section data-panel="wait" role="tabpanel" hidden>
      <div class="toolbar"><h2>候補名單</h2><p class="hint">有人取消後按「安排入座」，系統會自動找空桌。</p></div>
      <div id="waitlist" class="list"></div>
    </section>

    <section data-panel="stats" role="tabpanel" hidden>
      <div id="stats"></div>
    </section>

    <section data-panel="settings" role="tabpanel" hidden>
      <form id="settings-form" class="panel">
        <h2>營業時間</h2>
        <p class="hint">設定每天的「第一個入座」到「最後入座」時間，客人只能選這段時間內的時段。</p>
        <div class="sched" id="sched"></div>
        <h3>特別公休日</h3>
        <div class="closed" id="closed"></div>
        <div class="inline"><input type="date" id="closed-add" aria-label="新增公休日"><button type="button" class="ghost" id="closed-btn">加入公休</button></div>
        <h3>訂位規則</h3>
        <div class="rules-grid">
          <label>時段間隔<select name="slot_minutes"><option value="15">15 分鐘</option><option value="30">30 分鐘</option><option value="60">60 分鐘</option></select></label>
          <label>每桌用餐時間（分鐘）<input type="number" name="dining_minutes" min="30" max="300" step="15" required></label>
          <label>開放幾天內的訂位<input type="number" name="booking_days" min="1" max="180" required></label>
          <label>線上最多人數<input type="number" name="max_party" min="1" max="30" required></label>
          <label>當天截止（開始前幾分鐘）<input type="number" name="cutoff_minutes" min="0" max="1440" step="15" required></label>
        </div>
        <p class="error" id="settings-error" role="alert"></p>
        <button class="primary" type="submit">儲存設定</button>
      </form>

      <form id="tables-form" class="panel">
        <h2>桌位</h2>
        <p class="hint">停用的桌子不會被安排新訂位（已有的訂位不受影響）。</p>
        <div class="tables-head" aria-hidden="true"><span>桌號</span><span>座位數</span><span>區域</span><span>啟用</span></div>
        <div id="tables"></div>
        <p class="error" id="tables-error" role="alert"></p>
        <div class="inline"><button type="button" class="ghost" id="add-table">新增一桌</button><button class="primary" type="submit">儲存桌位</button></div>
      </form>

      <div class="panel danger">
        <h2>Demo 資料</h2>
        <p class="hint">清除所有訂位、候補與設定，重新產生前後一個月的假資料。</p>
        <button type="button" class="ghost warn" id="reset">重置 Demo 資料</button>
      </div>
    </section>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="dlg-form">
    <header><h2 id="dlg-title"></h2><button type="button" class="icon" data-close aria-label="關閉"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 3.5 9 9m0-9-9 9"/></svg></button></header>
    <div class="dlg-grid">
      <label>姓名<input name="name" required maxlength="40"></label>
      <label>手機<input name="phone" required inputmode="tel"></label>
      <label>人數<input name="party" type="number" min="1" max="20" required></label>
      <label>日期<input name="date" type="date" required></label>
      <label>時間<input name="time" type="time" step="900" required></label>
      <label>桌位<select name="table_id"></select></label>
      <label class="edit-only">狀態<select name="status">
        <option value="confirmed">已確認</option><option value="seated">已入座</option><option value="completed">已完成</option><option value="no_show">未到</option><option value="cancelled">已取消</option>
      </select></label>
      <label class="new-only">來源<select name="source"><option value="phone">電話</option><option value="walk_in">現場</option><option value="web">網路</option></select></label>
      <label>座位偏好<select name="area_pref"><option value="">不指定</option><option>窗邊</option><option>大廳</option><option>吧台</option><option>包廂</option></select></label>
      <label>用餐目的<select name="occasion"><option value="">一般</option><option>生日</option><option>紀念日</option><option>約會</option><option>商務</option><option>家庭聚餐</option></select></label>
      <label class="span">Email<input name="email" type="email" maxlength="100"></label>
      <label class="span">備註<textarea name="notes" rows="2" maxlength="300"></textarea></label>
    </div>
    <p class="meta" id="dlg-meta"></p>
    <p class="error" id="dlg-error" role="alert"></p>
    <footer><button type="button" class="ghost" data-close>取消</button><button class="primary" type="submit">儲存</button></footer>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/admin/admin.js"></script>
</body>
</html>
